[project]
name = "compliancegpt"
version = "0.0.1"
description = "Temporally-aware agentic RAG over RBI/SEBI regulatory documents"
requires-python = ">=3.11"

# Phase 0 dependencies only. Heavy ML libraries (torch, sentence-transformers,
# docling) are deliberately deferred to Phase 1 so early setup stays fast.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",      # PostgreSQL driver (psycopg v3)
    "qdrant-client>=1.12",       # vector DB client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",               # test client for FastAPI
    "ruff>=0.7",                 # linter + formatter
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list keeps setuptools from scanning data/ and docs/.
packages = ["app", "ingestion", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes (real errors); I = import sorting; UP = modernize syntax.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
