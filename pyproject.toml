[project]
name = "compliancegpt"
version = "0.0.1"
description = "Temporally-aware agentic RAG over RBI/SEBI regulatory documents"
requires-python = ">=3.11"

dependencies = [
    # ---- serving plane ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",      # PostgreSQL driver (psycopg v3)
    "qdrant-client>=1.12",       # vector DB client
    # ---- ingestion plane ----
    "httpx>=0.27",               # HTTP client for the scraper
    "beautifulsoup4>=4.12",      # HTML parsing of RBI listing pages
    "lxml>=5.3",                 # fast HTML/XML parser backend for bs4
    "pdfplumber>=0.11",          # PDF text extraction (low-memory parser)
    # ---- retrieval ----
    "sentence-transformers>=3.0",# embeddings + cross-encoder reranker
    "rank-bm25>=0.2",            # BM25 lexical retrieval (hybrid + RRF)
    # ---- agent + LLM ----
    "langgraph>=0.2",            # agent state machine (classify->...->respond)
    "openai>=1.40",              # LLM via any OpenAI-compatible API (Groq default)
    "anthropic>=0.40",           # optional: Claude provider path
    # ---- UI ----
    "streamlit>=1.38",           # minimal chat UI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",               # test client for FastAPI
    "ruff>=0.7",                 # linter + formatter
]
# Layout-aware parser (better tables) — needs significant RAM. Opt-in upgrade
# over the default pdfplumber path: pip install -e ".[docling]"
docling = ["docling>=2.0"]
# Hosted trace export. Optional by design: without it the agent still records
# per-node latency in-process (app/observability/tracing.py), so the latency
# numbers this project reports never depend on an external service being up.
langfuse = ["langfuse>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list keeps setuptools from scanning data/ and docs/.
packages = ["app", "ingestion", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes (real errors); I = import sorting; UP = modernize syntax.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
