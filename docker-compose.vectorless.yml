# Local PostgreSQL only. Run the Python API/UI on the host.
# docker compose -f docker-compose.vectorless.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliancegpt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliancegpt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
